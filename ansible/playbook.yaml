---
- name: Configure Jenkins and SonarQube Servers
  hosts: all
  become: yes
  tasks:
    - name: Update apt repo and cache
      apt:
        update_cache: yes
        force_apt_get: yes
    - name: Set vm.max_map_count for SonarQube
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: yes
    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present
    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
    - name: Install Docker engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
    - name: Install Docker SDK for Python
      apt:
        name: python3-docker
        state: present
    - name: Add user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
    - name: Create data directories with correct permissions
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - /home/ubuntu/jenkins_data
        - /home/ubuntu/sonar_data
        - /home/ubuntu/jenkins_data/init.groovy.d/
    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes
    - name: Create Jenkins Admin User Script
      ansible.builtin.copy:
        dest: /home/ubuntu/jenkins_data/init.groovy.d/basic-security.groovy
        content: |
           import jenkins.model.*
           import hudson.security.*

           def instance = Jenkins.getInstance()

           def hudsonRealm = new HudsonPrivateSecurityRealm(false)
           hudsonRealm.createAccount("admin", "admin")
           instance.setSecurityRealm(hudsonRealm)

           def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
           instance.setAuthorizationStrategy(strategy)

           instance.save()
        owner: "1000"
        group: "1000"
        mode: "0644"
    - name: Start Jenkins container
      community.docker.docker_container:
        name: jenkins
        image: jenkins/jenkins:lts
        ports:
          - "8080:8080"
        volumes:
          - "/home/ubuntu/jenkins_data:/var/jenkins_home"
        env:
          JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
        state: started
    - name: Start SonarQube container
      community.docker.docker_container:
        name: sonarqube
        image: sonarqube:lts
        ports:
          - "9000:9000"
        volumes:
          - "/home/ubuntu/sonar_data:/opt/sonarqube/data"
        state: started

    
